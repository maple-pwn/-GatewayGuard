plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.chaquo.python'
}

def releaseKeystoreFile = rootProject.file("keystore/release-keystore.jks")
def releaseStorePassword = (project.findProperty("release.storePassword")
        ?: System.getenv("RELEASE_STORE_PASSWORD")
        ?: "gatewayguard123").toString()
def releaseKeyAlias = (project.findProperty("release.keyAlias")
        ?: System.getenv("RELEASE_KEY_ALIAS")
        ?: "gatewayguard").toString()
def releaseKeyPassword = (project.findProperty("release.keyPassword")
        ?: System.getenv("RELEASE_KEY_PASSWORD")
        ?: releaseStorePassword).toString()

android {
    namespace 'com.gatewayguard.android'
    compileSdk 36

    defaultConfig {
        applicationId "com.gatewayguard.android"
        minSdk 24
        targetSdk 30
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "x86_64", "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            storeFile releaseKeystoreFile
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            ndk {
                abiFilters "arm64-v8a"
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

chaquopy {
    defaultConfig {
        def chaquopyVersion = (project.findProperty("chaquopy.version")
                ?: System.getenv("CHAQUOPY_VERSION")
                ?: "3.10").toString()
        version = chaquopyVersion
        def hostPython = project.findProperty("chaquopy.python") ?: System.getenv("CHAQUOPY_PYTHON")
        if (hostPython != null && !hostPython.toString().trim().isEmpty()) {
            buildPython(hostPython.toString())
        } else {
            buildPython("python")
        }
        pip {
            install("-r", "../../backend/requirements-android.txt")
        }
    }
    sourceSets {
        main {
            srcDir "../../backend"
            include "app/**"
            include "android_entry.py"
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
